<div class="header">
  <div class="heading">
    <h2 mat-dialog-title class="title">Create a new collection</h2>
    <p class="subtitle">Give your collection a name, or leave it empty and we'll pick one.</p>
  </div>
  <button matIconButton mat-dialog-close type="button" class="close" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<form (submit)="submit($event)" novalidate>
  <mat-dialog-content class="fields">
    <mat-form-field class="name-field">
      <mat-label>Collection name (optional)</mat-label>
      <input
        matInput
        cdkFocusInitial
        placeholder="Generated if left empty"
        [formField]="createForm.name"
      />
      @if (createForm.name().invalid()) {
        <mat-error>{{ createForm.name().errors()[0].message }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions class="actions">
    <button matButton="filled" type="submit" class="create" [disabled]="createForm().submitting()">
      Create
    </button>
  </mat-dialog-actions>
</form>
