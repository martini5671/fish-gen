<section class="collections" aria-labelledby="collections-title">
  <div class="collections-toolbar">
    <div class="filters">
      <mat-form-field class="search-field" subscriptSizing="dynamic">
        <input
          matInput
          type="search"
          placeholder="Search"
          aria-label="Search collections"
          [value]="store.name()"
          (input)="onSearch($any($event.target).value)"
        />
      </mat-form-field>
      <mat-form-field class="sort-field" subscriptSizing="dynamic">
        <mat-select
          aria-label="Sort by"
          [value]="store.sort()"
          (valueChange)="store.setSort($event)"
        >
          @for (option of sortOptions; track option.value) {
            <mat-option [value]="option.value">{{ option.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <button class="new-button" matButton="filled" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      New collection
    </button>
  </div>
  <div class="collection-grid">
    @for (collection of store.collections(); track collection.id) {
      <app-collection-component
        [collectionId]="collection.id"
        [collectionName]="collection.name"
        [creationDate]="collection.createdAt"
      />
    }
  </div>
  <mat-paginator
    [length]="store.totalElements()"
    [pageIndex]="store.pageIndex()"
    [pageSize]="store.pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPage($event)"
    aria-label="Choose a page of collections"
  />

</section>
